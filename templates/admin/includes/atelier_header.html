<!-- BEGIN: Top Navigation Header -->
<header class="h-16 border-b border-obsidian-700/60 bg-obsidian-900/60 backdrop-blur-md sticky top-0 z-30 px-4 sm:px-6 flex items-center justify-between gap-3 sm:gap-4" data-purpose="top-header">
<!-- Mobile Hamburger & Brand Identity -->
<div class="flex items-center gap-2 lg:hidden">
<button aria-label="Open navigation menu" class="p-2 -ml-2 rounded-lg text-neutral-300 hover:text-white hover:bg-obsidian-800 transition" id="open-mobile-drawer">
<svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path></svg>
</button>
<div class="flex items-center gap-2">
<div class="w-7 h-7 rounded-lg bg-emerald-500/10 border border-emerald-500/30 flex items-center justify-center text-emerald-400">
<svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M12 3L2 9l10 12 10-12-10-6zM2 9h20M12 21L7 9m5 12l5-12" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8"></path></svg>
</div>
<span class="tracking-[0.18em] text-[11px] font-bold text-neutral-100 uppercase font-sans hidden sm:inline">Luckjary</span>
</div>
</div>
<!-- Search Input Container -->
<div class="flex-1 max-w-xl min-w-0">
  <form action="{% url 'admin:catalog_product_changelist' %}" method="get" class="m-0 p-0 relative flex items-center w-full" data-purpose="top-search-form">
    <span class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-neutral-400">
      <svg class="w-4 h-4 text-neutral-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path></svg>
    </span>
    <input name="q" 
           id="universalHeaderSearch" 
           autocomplete="off" 
           spellcheck="false" 
           class="w-full glass-input text-xs text-neutral-200 placeholder-neutral-400 pl-9 pr-24 sm:pr-28 py-2 rounded-lg transition outline-none truncate font-sans" 
           placeholder="Search orders, fine jewelry..." 
           type="text" 
           style="background-color: #111317 !important; color: #f3f4f6 !important; border: 1px solid rgba(255, 255, 255, 0.08) !important;">
    <div class="absolute inset-y-0 right-1.5 flex items-center gap-1.5">
      <kbd class="hidden md:inline-flex text-[10px] font-mono text-neutral-400 bg-obsidian-800/80 border border-obsidian-700 px-1.5 py-0.5 rounded pointer-events-none">⌘K</kbd>
      <button type="submit" 
              class="inline-flex items-center gap-1 px-2.5 py-1 text-[11px] font-semibold font-sans tracking-wide bg-[#171920] hover:bg-emerald-500 text-neutral-200 hover:text-[#07080a] border border-[#21242d] hover:border-emerald-500 rounded-md transition-all shadow-sm cursor-pointer select-none"
              style="text-decoration: none !important;"
              title="Search atelier catalog">
        <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2"></path></svg>
        <span>Search</span>
      </button>
    </div>
  </form>
</div>
<!-- Right Header Actions -->
<div class="flex items-center gap-2 sm:gap-3 flex-shrink-0">
<a class="hidden md:inline-flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-xs font-medium text-neutral-300 hover:text-white border border-obsidian-700 bg-obsidian-800/60 hover:bg-obsidian-800 transition" href="/" target="_blank" style="text-decoration: none !important;">
<svg class="w-3.5 h-3.5 text-neutral-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path></svg>
    Online Store
  </a>
<a href="{% url 'orders:oms_dashboard' %}" class="hidden sm:flex items-center gap-1.5 px-2.5 py-1.5 rounded-lg bg-emerald-950/40 border border-emerald-500/20 text-xs font-mono text-emerald-400 whitespace-nowrap hover:bg-emerald-950/70 transition" style="text-decoration: none !important;">
<span class="w-2 h-2 rounded-full bg-emerald-400 animate-ping"></span>
<span class="hidden md:inline">Atelier OMS</span>
</a>
<div class="h-5 w-px bg-obsidian-700 hidden sm:block"></div>
<div class="flex items-center gap-2 pl-0 sm:pl-1">
<div class="w-8 h-8 rounded-lg bg-champagne-300/10 border border-champagne-400/30 flex items-center justify-center text-champagne-400 font-bold text-xs font-mono flex-shrink-0">
      {{ request.user.first_name|slice:":1"|default:"E"|upper }}
    </div>
<div class="hidden xl:flex flex-col text-left leading-tight">
<span class="text-xs font-semibold text-neutral-100">{{ request.user.first_name|default:"Eleanor" }}</span>
<span class="text-[9px] tracking-widest uppercase font-mono text-champagne-400/90 font-medium">Director</span>
</div>
</div>
<form method="post" action="{% url 'admin:logout' %}" class="inline m-0 p-0">
{% csrf_token %}
<button type="submit" class="flex items-center gap-1.5 text-xs text-neutral-400 hover:text-rose-400 p-1.5 sm:px-2 sm:py-1.5 transition bg-transparent border-0 cursor-pointer" title="Log Out">
<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8"></path></svg>
<span class="hidden xl:inline">Log Out</span>
</button>
</form>
</div>
</header>
<!-- END: Top Navigation Header -->
