{% load i18n admin_urls static %}
<!-- Top Universal Header Bar (Unified for All Atelier Pages) -->
<header class="sticky top-0 z-30 w-full bg-[#0e1015]/95 backdrop-blur-2xl border-b border-[#232732] shadow-sm relative">
  <div class="px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
    
    <!-- Mobile Drawer Toggle (Only visible on mobile/tablet when sidebar is off-canvas) -->
    <div class="flex lg:hidden items-center gap-2.5">
      <button id="openMobileDrawerBtn" aria-label="Toggle Navigation Panel" class="w-9 h-9 rounded-xl bg-[#151720] hover:bg-[#1e212d] text-zinc-300 hover:text-white border border-[#262A36] flex items-center justify-center active:scale-95 transition-all cursor-pointer shadow-sm" type="button" title="Toggle Navigation">
        <span class="material-symbols-outlined text-[20px]">menu</span>
      </button>
      <div class="flex items-center gap-2">
        <div class="w-7 h-7 rounded-lg bg-[#14161C] border border-[#E9C176]/30 flex items-center justify-center text-[#E9C176]">
          <span class="material-symbols-outlined text-[15px]">diamond</span>
        </div>
        <span class="text-xs uppercase font-sans tracking-[0.2em] font-bold text-white">Luckjary</span>
      </div>
    </div>

    <!-- Desktop Spacer (Keeps profile aligned to the right) -->
    <div class="hidden lg:block"></div>

    <!-- Right: Executive Director Profile Menu -->
    <div class="flex items-center gap-2 ml-auto">
      <div class="relative inline-block text-left" id="profileDropdownWrapper">
        <button id="profileDropdownBtn" class="flex items-center gap-2 pl-1.5 pr-2 py-1 rounded-xl bg-[#151720] hover:bg-[#1e212d] border border-[#262A36] hover:border-amber-400/40 transition-all cursor-pointer shadow-sm" type="button" aria-expanded="false">
          <div class="w-7 h-7 rounded-lg bg-gradient-to-tr from-amber-600 via-[#ebd38d] to-amber-200 text-[#0d0e10] flex items-center justify-center text-xs font-bold font-mono shadow-sm shrink-0">
            E
          </div>
          <div class="flex flex-col text-left">
            <span class="text-xs font-semibold text-zinc-100 leading-tight">Eleanor</span>
            <span class="text-[9px] uppercase tracking-wider text-amber-300 font-mono leading-tight font-medium">Director</span>
          </div>
          <span class="material-symbols-outlined text-[15px] text-zinc-400 transition-transform duration-200" id="profileChevron">expand_more</span>
        </button>
        
        <!-- Profile Dropdown Popup -->
        <div id="profileDropdownMenu" class="absolute right-0 mt-2 w-56 bg-[#181A22]/95 backdrop-blur-xl border border-[#2D3240] rounded-xl shadow-2xl py-2 z-50 hidden">
          <div class="px-3.5 py-2 border-b border-[#232732]">
            <p class="text-xs font-semibold text-zinc-100">{{ user.get_full_name|default:"Eleanor Vance" }}</p>
            <p class="text-[10px] text-amber-300 font-mono">{{ user.email|default:"director@luckjary.com" }}</p>
            <span class="inline-block mt-1 text-[9px] uppercase tracking-wider bg-amber-400/15 text-amber-300 px-1.5 py-0.2 rounded font-semibold border border-amber-400/25">Haute Atelier Admin</span>
          </div>
          <div class="py-1">
            <a href="/admin/password_change/" class="flex items-center gap-2 px-3.5 py-2 text-xs text-zinc-200 hover:bg-[#20232e] transition-colors">
              <span class="material-symbols-outlined text-[16px] text-zinc-400">key</span>
              <span>Security &amp; Passkey</span>
            </a>
            <a href="/" target="_blank" class="flex items-center gap-2 px-3.5 py-2 text-xs text-zinc-200 hover:bg-[#20232e] transition-colors">
              <span class="material-symbols-outlined text-[16px] text-zinc-400">storefront</span>
              <span>Customer Boutique</span>
            </a>
            <a href="/admin/orders/order/#settings" class="w-full text-left flex items-center gap-2 px-3.5 py-2 text-xs text-zinc-200 hover:bg-[#20232e] transition-colors cursor-pointer">
              <span class="material-symbols-outlined text-[16px] text-zinc-400">settings</span>
              <span>Preferences</span>
            </a>
          </div>
          <div class="border-t border-[#232732] my-1"></div>
          <div class="py-1">
            <form method="post" action="{% url 'admin:logout' %}" class="block m-0 p-0">
              {% csrf_token %}
              <button type="submit" class="w-full text-left flex items-center gap-2 px-3.5 py-2 text-xs text-red-400 hover:text-red-300 hover:bg-red-950/40 transition-colors cursor-pointer">
                <span class="material-symbols-outlined text-[16px] text-red-400">logout</span>
                <span>Sign Out</span>
              </button>
            </form>
          </div>
        </div>
      </div>
    </div>

  </div>
</header>
