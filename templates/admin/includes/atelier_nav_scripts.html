<script>
document.addEventListener('DOMContentLoaded', () => {
  // Mobile Navigation Drawer Toggle
  const openMobileBtn = document.getElementById('openMobileDrawerBtn') || document.getElementById('openNavDrawerBtn');
  const closeMobileBtn = document.getElementById('closeMobileDrawerBtn') || document.getElementById('closeNavDrawerBtn');
  const mobileModal = document.getElementById('mobileDrawerModal');
  const mobileBackdrop = document.getElementById('mobileDrawerBackdrop');
  const mobilePanel = document.getElementById('mobileDrawerPanel');

  function openMobileDrawer() {
    if (!mobileModal || !mobilePanel || !mobileBackdrop) return;
    mobileModal.classList.remove('pointer-events-none');
    mobileBackdrop.classList.remove('opacity-0', 'pointer-events-none');
    mobileBackdrop.classList.add('opacity-100');
    mobilePanel.classList.remove('-translate-x-full');
    document.body.style.overflow = 'hidden';
  }

  function closeMobileDrawer() {
    if (!mobileModal || !mobilePanel || !mobileBackdrop) return;
    mobilePanel.classList.add('-translate-x-full');
    mobileBackdrop.classList.remove('opacity-100');
    mobileBackdrop.classList.add('opacity-0', 'pointer-events-none');
    setTimeout(() => {
      mobileModal.classList.add('pointer-events-none');
    }, 300);
    document.body.style.overflow = '';
  }

  // Expose globally for page-level scripts
  window.openMobileDrawer = openMobileDrawer;
  window.closeMobileDrawer = closeMobileDrawer;

  if (openMobileBtn) {
    openMobileBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      openMobileDrawer();
    });
  }

  if (closeMobileBtn) {
    closeMobileBtn.addEventListener('click', closeMobileDrawer);
  }

  if (mobileBackdrop) {
    mobileBackdrop.addEventListener('click', closeMobileDrawer);
  }

  // Profile Dropdown Toggle
  const profileBtn = document.getElementById('profileDropdownBtn');
  const profileMenu = document.getElementById('profileDropdownMenu');
  const profileChevron = document.getElementById('profileChevron');

  if (profileBtn && profileMenu) {
    profileBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      const isClosed = profileMenu.classList.contains('is-hidden') || profileMenu.classList.contains('hidden');
      if (isClosed) {
        profileMenu.classList.remove('is-hidden', 'hidden');
        if (profileChevron) profileChevron.classList.add('rotate-180');
      } else {
        profileMenu.classList.add('is-hidden');
        if (profileChevron) profileChevron.classList.remove('rotate-180');
      }
    });

    document.addEventListener('click', (e) => {
      if (!profileMenu.contains(e.target) && !profileBtn.contains(e.target)) {
        profileMenu.classList.add('is-hidden');
        if (profileChevron) profileChevron.classList.remove('rotate-180');
      }
    });
  }

  // Universal Hotkeys: Escape to close modals, Ctrl+K / Cmd+K to search
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') {
      closeMobileDrawer();
      if (profileMenu && !profileMenu.classList.contains('is-hidden')) {
        profileMenu.classList.add('is-hidden');
        if (profileChevron) profileChevron.classList.remove('rotate-180');
      }
    }
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') {
      const searchInput = document.getElementById('universalHeaderSearch');
      if (searchInput) {
        e.preventDefault();
        searchInput.focus();
        searchInput.select();
      }
    }
  });

  // Realtime Sidebar Badge Sync (polls summary counts every 15s while tab is active)
  if (!window.__atelierSidebarPollerStarted) {
    window.__atelierSidebarPollerStarted = true;
    const syncSidebarBadges = async () => {
      if (document.hidden) return;
      try {
        const res = await fetch('/admin/api/live-telemetry/?summary=1', {
          headers: { 'X-Requested-With': 'XMLHttpRequest' },
          cache: 'no-store'
        });
        if (!res.ok) return;
        const data = await res.json();
        if (data.status !== 'ok') return;
        if (typeof data.total_products === 'number') {
          document.querySelectorAll('.sidebar-products-count').forEach(el => {
            el.textContent = data.total_products;
          });
        }
        if (typeof data.total_orders === 'number') {
          document.querySelectorAll('.sidebar-orders-count').forEach(el => {
            el.textContent = data.total_orders;
          });
        }
      } catch (err) {}
    };
    setInterval(syncSidebarBadges, 15000);
  }
});
</script>
