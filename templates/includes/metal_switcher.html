<!-- GIVA-Inspired Silver & Fashion Jewellery Switcher -->
<div class="metal-switcher-container w-full bg-[#FAF9F6] border-b border-[#EBE6DF]/70 py-2 sm:py-3 px-2 sm:px-3">
    <div class="max-w-7xl mx-auto flex items-center justify-center">
        <!-- Capsule Switcher Frame (Fully responsive, 2-tier selection: Silver & Fashion) -->
        <nav class="relative inline-flex items-center p-0.5 sm:p-1.5 rounded-full border border-[#C5A059] sm:border-[1.5px] bg-white shadow-[0_2px_10px_rgba(197,160,89,0.08)] max-w-full select-none" 
             aria-label="Jewellery Collection Switcher" 
             role="tablist">
            
            <!-- Silver Jewellery -->
            <a href="{% if '/shop/' in request.path or '/category/' in request.path %}?{% if request.GET.category %}category={{ request.GET.category }}&{% endif %}metal=silver{% elif request.path == '/' %}/?metal=silver{% else %}{% url 'catalog:product_list' %}?metal=silver{% endif %}"
               role="tab"
               aria-selected="{% if active_metal == 'silver' or not active_metal %}true{% else %}false{% endif %}"
               data-metal="silver"
               onclick="handleMetalSwitch(event, 'silver')"
               class="metal-switcher-pill relative z-10 px-4 sm:px-8 md:px-10 py-1.5 sm:py-2 rounded-full text-xs sm:text-[13px] md:text-sm font-medium transition-all duration-300 ease-out whitespace-nowrap select-none {% if active_metal == 'silver' or not active_metal %}bg-[#366E63] text-white shadow-sm font-semibold active-pill{% else %}text-neutral-700 hover:text-neutral-900 hover:bg-[#FAF9F6]{% endif %}">
                <span>Silver Jewellery</span>
            </a>

            <!-- Fashion Jewellery -->
            <a href="{% if '/shop/' in request.path or '/category/' in request.path %}?{% if request.GET.category %}category={{ request.GET.category }}&{% endif %}metal=fashion{% elif request.path == '/' %}/?metal=fashion{% else %}{% url 'catalog:product_list' %}?metal=fashion{% endif %}"
               role="tab"
               aria-selected="{% if active_metal == 'fashion' %}true{% else %}false{% endif %}"
               data-metal="fashion"
               onclick="handleMetalSwitch(event, 'fashion')"
               class="metal-switcher-pill relative z-10 px-4 sm:px-8 md:px-10 py-1.5 sm:py-2 rounded-full text-xs sm:text-[13px] md:text-sm font-medium transition-all duration-300 ease-out whitespace-nowrap select-none {% if active_metal == 'fashion' %}bg-[#366E63] text-white shadow-sm font-semibold active-pill{% else %}text-neutral-700 hover:text-neutral-900 hover:bg-[#FAF9F6]{% endif %}">
                <span>Fashion Jewellery</span>
            </a>
        </nav>
    </div>
</div>

<script>
function handleMetalSwitch(e, metal) {
    if (e.metaKey || e.ctrlKey || e.shiftKey || e.button !== 0) {
        return; // Allow open in new tab
    }
    e.preventDefault();

    // Remember in localStorage for quick client-side hydration
    try {
        localStorage.setItem('luckjary_selected_metal', metal);
    } catch (err) {}

    const currentPath = window.location.pathname;
    const urlParams = new URLSearchParams(window.location.search);
    urlParams.set('metal', metal);
    urlParams.delete('page'); // reset to page 1

    if (currentPath.includes('/shop/') || currentPath.includes('/category/')) {
        window.location.href = currentPath + '?' + urlParams.toString();
    } else if (currentPath === '/' || currentPath === '') {
        window.location.href = '/?' + urlParams.toString();
    } else {
        // From any other page, navigate directly to catalog with the chosen metal
        window.location.href = "{% url 'catalog:product_list' %}?metal=" + encodeURIComponent(metal);
    }
}
</script>
